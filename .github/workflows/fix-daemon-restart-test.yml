name: Repair daemon restart verification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/fix-daemon-restart-test.yml

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
  PASEO_DICTATION_ENABLED: "0"
  PASEO_VOICE_MODE_ENABLED: "0"
  CODIUS_SEED_DEFAULTS: "0"

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/npm-retry.mjs ci

      - name: Wait for post-restart health instead of only the new PID
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/cli/tests/25-daemon-restart-supervisor.test.ts")
          source = path.read_text()
          old = '''  const statusAfterRestart = await readDaemonStatus(paseoHome);
  assert.strictEqual(
    statusAfterRestart.localDaemon,
    "running",
    "daemon should stay running after restart",
  );'''
          new = '''  await waitFor(
    async () => (await readDaemonStatus(paseoHome)).localDaemon === "running",
    120000,
    "daemon did not become healthy after the supervised restart",
  );

  const statusAfterRestart = await readDaemonStatus(paseoHome);
  assert.strictEqual(
    statusAfterRestart.localDaemon,
    "running",
    "daemon should stay running after restart",
  );'''
          if old not in source:
              if new in source:
                  raise SystemExit(0)
              raise SystemExit("expected restart assertion block was not found")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Verify the exact restart regression test
        shell: bash
        run: |
          npm run build:server
          npx tsx packages/cli/tests/25-daemon-restart-supervisor.test.ts

      - name: Commit verified test repair
        shell: bash
        run: |
          git config user.name "Codius Automation"
          git config user.email "actions@codius.ai"
          git add packages/cli/tests/25-daemon-restart-supervisor.test.ts
          if git diff --cached --quiet; then
            echo "Restart verification was already repaired."
            exit 0
          fi
          git commit -m "test: wait for daemon health after supervised restart"
          git push origin HEAD:feat/codius-productization
