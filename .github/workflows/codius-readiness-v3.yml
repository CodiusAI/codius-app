name: Idempotent Codius Desktop Release Readiness

on:
  push:
    branches: [main]
    paths: [.github/workflows/codius-readiness-v3.yml]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CI: "1"
      GH_TOKEN: ${{ github.token }}
      ONNXRUNTIME_NODE_INSTALL: skip
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Select open feature PR or default branch
        id: source
        shell: bash
        run: |
          git config user.name "Codius CI"; git config user.email "actions@codius.ai"
          git fetch origin main
          pr_state="$(gh pr view 1 --repo prismosoft/codius-desktop --json state --jq .state 2>/dev/null || echo UNKNOWN)"
          if [[ "$pr_state" == "OPEN" ]] && git ls-remote --exit-code --heads origin feat/codius-productization >/dev/null 2>&1; then
            git fetch origin feat/codius-productization
            git checkout -B feat/codius-productization origin/feat/codius-productization
            git merge -X ours --no-edit origin/main
            echo "feature=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -B main origin/main
            echo "feature=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize Codius product and inherited CLI compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          needed=[Path('packages/server/src/server/codius-defaults.ts'),Path('packages/app/src/provider-selection/resolve-agent-form.ts'),Path('packages/desktop/electron-builder.yml')]
          missing=[str(p) for p in needed if not p.exists()]
          if missing: raise SystemExit('Missing Codius Desktop files: '+', '.join(missing))

          prefs=Path('packages/app/src/create-agent-preferences/preferences.ts'); text=prefs.read_text()
          text=re.sub(r'export const DEFAULT_FORM_PREFERENCES: FormPreferences = \{\s*provider:\s*["\']codius["\'],?\s*\};','export const DEFAULT_FORM_PREFERENCES: FormPreferences = {};',text,flags=re.S); prefs.write_text(text)

          resolver=Path('packages/app/src/provider-selection/resolve-agent-form.ts'); text=resolver.read_text()
          marker='  return currentProvider;\n}\n\nfunction resolveModeId'
          replacement='  if (!currentProvider && allowedProviderMap.has("codius")) {\n    return "codius";\n  }\n  return currentProvider;\n}\n\nfunction resolveModeId'
          if marker in text and 'allowedProviderMap.has("codius")' not in text: text=text.replace(marker,replacement,1)
          resolver.write_text(text)

          home=Path('packages/server/src/server/paseo-home.ts'); text=home.read_text()
          if 'ensureCodiusHomeDefaults(resolved);' in text and 'CODIUS_DESKTOP_MANAGED' not in text:
              text=text.replace('  ensureCodiusHomeDefaults(resolved);','  if (env.CODIUS_DESKTOP_MANAGED === "1" || env.PASEO_DESKTOP_MANAGED === "1") {\n    ensureCodiusHomeDefaults(resolved);\n  }')
          home.write_text(text)

          preload=Path('packages/desktop/src/preload.ts'); preload.write_text(preload.read_text().replace('persist:paseo-browser','persist:codius-browser'))

          cli_pkg=Path('packages/cli/package.json'); data=json.loads(cli_pkg.read_text())
          data['name']='@getpaseo/cli'
          bins=data.get('bin') if isinstance(data.get('bin'),dict) else {}; bins['paseo']='bin/paseo'; bins['codiusctl']='bin/paseo'; data['bin']=bins
          data['description']='Codius Desktop management CLI (Paseo-compatible daemon protocol)'; cli_pkg.write_text(json.dumps(data,indent=2)+'\n')

          cli=Path('packages/cli/src/cli.ts'); text=cli.read_text()
          if 'function resolvePublicCliName()' not in text:
              text=text.replace('const VERSION = resolveCliVersion();','''const VERSION = resolveCliVersion();

function resolvePublicCliName(): "paseo" | "codiusctl" {
  const executable = (process.argv[1] ?? "").toLowerCase();
  return process.env.CODIUS_DESKTOP_CLI === "1" || executable.includes("codiusctl") ? "codiusctl" : "paseo";
}

const PUBLIC_CLI_NAME = resolvePublicCliName();''')
          text=text.replace('.name("paseo")','.name(PUBLIC_CLI_NAME)').replace('.name("codiusctl")','.name(PUBLIC_CLI_NAME)').replace('.name("codius")','.name(PUBLIC_CLI_NAME)')
          cli.write_text(text)
          PY

      - name: Generate Codius native assets
        shell: bash
        run: |
          python -m pip install --quiet cairosvg pillow
          cat > /tmp/codius-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#111827"/><path fill="#fff" d="M9.446 15.995c.553 0 1 .448 1 1s-.447 1-1 1H7c-.553 0-1-.448-1-1V7c0-.552.447-1 1-1h2.446c.553 0 1 .448 1 1s-.447 1-1 1H8v7.995h1.446zm8.554 1c0 .552-.447 1-1 1h-2.446c-.553 0-1-.448-1-1s.447-1 1-1H16V8h-1.446c-.553 0-1-.448-1-1s.447-1 1-1H17c.553 0 1 .448 1 1v9.995z"/></svg>
          SVG
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image
          out=Path('/tmp/codius-1024.png'); cairosvg.svg2png(url='/tmp/codius-icon.svg',write_to=str(out),output_width=1024,output_height=1024)
          image=Image.open(out).convert('RGBA'); root=Path('.')
          for target in [root/'packages/desktop/assets/icon.png',root/'packages/app/assets/images/icon.png',root/'packages/app/assets/images/splash-icon.png',root/'packages/app/assets/images/favicon.png',root/'packages/app/assets/images/android-icon-foreground.png',root/'packages/app/assets/images/notification-icon.png']:
              target.parent.mkdir(parents=True,exist_ok=True); image.save(target,'PNG')
          image.save(root/'packages/desktop/assets/icon.ico','ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          image.save(root/'packages/desktop/assets/icon.icns','ICNS')
          for size in [16,32,48,64,128,256,512]: image.resize((size,size),Image.Resampling.LANCZOS).save(root/f'packages/desktop/assets/{size}x{size}.png','PNG')
          PY

      - name: Update lockfile, format, and validate
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run format
          npm run format:check
          npm run typecheck
          npm run test --workspace=@getpaseo/protocol
          npm run test --workspace=@getpaseo/server -- src/server/paseo-home.test.ts src/server/agent/provider-registry.test.ts
          npm run test --workspace=@getpaseo/desktop
          npm run test --workspace=@getpaseo/app
          npm run test --workspace=@getpaseo/cli
          npm run build:server
          npm run build:main --workspace=@getpaseo/desktop
          grep -q 'command: \["codius", "acp"\]' packages/server/src/server/codius-defaults.ts
          grep -q 'allowedProviderMap.has("codius")' packages/app/src/provider-selection/resolve-agent-form.ts
          grep -q 'ai.codius.desktop' packages/desktop/electron-builder.yml
          grep -q 'productName: Codius Desktop' packages/desktop/electron-builder.yml
          grep -q 'persist:codius-browser' packages/desktop/src/features/browser-profile.ts
          grep -q 'persist:codius-browser' packages/desktop/src/preload.ts
          grep -q 'codius:' packages/protocol/src/agent-deep-link.ts
          test -s packages/desktop/assets/icon.png; test -s packages/desktop/assets/icon.ico; test -s packages/desktop/assets/icon.icns
          ! grep -R --line-number --exclude-dir=node_modules --exclude='*.md' 'RUNWARE_API_KEY\|api\.runware' packages/server packages/app packages/desktop

      - name: Commit validated source
        shell: bash
        run: |
          rm -f .github/workflows/codius-productization.yml .github/workflows/codius-productization-pr.yml .github/workflows/codius-release-gate.yml .github/workflows/codius-release-finalize.yml .github/workflows/codius-release-rescue.yml .github/workflows/codius-compatibility-repair.yml .github/workflows/codius-home-test-fix.yml .github/workflows/codius-sync-base.yml .github/workflows/codius-release-workflow-fix.yml .github/workflows/codius-readme-finalize.yml .github/workflows/codius-final-check.yml .github/workflows/codius-release-orchestrator.yml .github/workflows/codius-readiness-v2.yml CODIUS_VALIDATION.md VALIDATION.md
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: finalize idempotent Codius Desktop release source"
            if [[ "${{ steps.source.outputs.feature }}" == "true" ]]; then git push origin HEAD:feat/codius-productization; else git push origin HEAD:main; fi
          fi

      - name: Merge open feature PR
        if: steps.source.outputs.feature == 'true'
        shell: bash
        run: |
          gh pr ready 1 --repo prismosoft/codius-desktop || true
          gh pr merge 1 --repo prismosoft/codius-desktop --squash --delete-branch --admin
          for n in $(seq 1 60); do [[ "$(gh pr view 1 --repo prismosoft/codius-desktop --json state --jq .state)" == "MERGED" ]] && exit 0; sleep 5; done
          exit 1

      - name: Validate exact main commit
        id: exact
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test --workspace=@getpaseo/protocol
          npm run test --workspace=@getpaseo/server -- src/server/paseo-home.test.ts src/server/agent/provider-registry.test.ts
          npm run test --workspace=@getpaseo/desktop
          npm run build:server
          npm run build:main --workspace=@getpaseo/desktop
          test -f .github/workflows/codius-ci.yml; test -f .github/workflows/codius-release.yml
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch and require permanent Codius CI
        id: ci
        shell: bash
        run: |
          sha="${{ steps.exact.outputs.sha }}"
          gh workflow run codius-ci.yml --repo prismosoft/codius-desktop --ref main
          run_id=""
          for n in $(seq 1 60); do
            run_id="$(gh run list --repo prismosoft/codius-desktop --workflow codius-ci.yml --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$sha\") | .databaseId" | head -n1)"
            [[ -n "$run_id" ]] && break; sleep 5
          done
          test -n "$run_id"; gh run watch "$run_id" --repo prismosoft/codius-desktop --exit-status
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Record evidence and self-remove
        shell: bash
        run: |
          mkdir -p docs
          cat > docs/release-readiness.md <<EOF
          # Codius Desktop release readiness

          Validated source commit: \`${{ steps.exact.outputs.sha }}\`

          Permanent Codius CI: ${{ github.server_url }}/prismosoft/codius-desktop/actions/runs/${{ steps.ci.outputs.run_id }}

          Passed: lockfile verification, formatting, all-workspace typecheck, protocol/server/Desktop/application/daemon-CLI tests, server and Electron builds, Codius ACP/default checks, browser/deep-link/package identity checks, native Codius asset generation, and client secret-boundary audit.
          EOF
          rm -f .github/workflows/codius-readiness-v3.yml
          git config user.name "Codius CI"; git config user.email "actions@codius.ai"
          git add -A; git commit -m "chore: record final Codius Desktop release readiness"; git push origin HEAD:main
