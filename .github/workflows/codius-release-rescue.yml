name: Codius Desktop Release Rescue

on:
  push:
    branches:
      - feat/codius-productization
    paths:
      - .github/workflows/codius-release-rescue.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      GH_TOKEN: ${{ github.token }}
      ONNXRUNTIME_NODE_INSTALL: skip
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0

      - name: Restore inherited daemon CLI internals
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- packages/cli/package.json packages/cli/src
          python - <<'PY'
          from pathlib import Path
          import json, re

          pkg = Path('packages/cli/package.json')
          data = json.loads(pkg.read_text())
          bins = data.get('bin') if isinstance(data.get('bin'), dict) else {}
          bins['paseo'] = 'bin/paseo'
          bins['codiusctl'] = 'bin/paseo'
          data['bin'] = bins
          data['description'] = 'Codius Desktop management CLI (Paseo-compatible daemon protocol)'
          pkg.write_text(json.dumps(data, indent=2) + '\n')

          cli = Path('packages/cli/src/cli.ts')
          text = cli.read_text()
          if 'function resolvePublicCliName()' not in text:
              text = text.replace(
                  'const VERSION = resolveCliVersion();',
                  '''const VERSION = resolveCliVersion();

function resolvePublicCliName(): "paseo" | "codiusctl" {
  const executable = (process.argv[1] ?? "").toLowerCase();
  return process.env.CODIUS_DESKTOP_CLI === "1" || executable.includes("codiusctl")
    ? "codiusctl"
    : "paseo";
}

const PUBLIC_CLI_NAME = resolvePublicCliName();''',
              )
              text = text.replace('.name("paseo")', '.name(PUBLIC_CLI_NAME)')
              text = text.replace(
                  '.description("Paseo CLI - control your AI coding agents from the command line")',
                  '.description(`${PUBLIC_CLI_NAME === "codiusctl" ? "Codius Desktop" : "Paseo"} CLI - control local coding agents`)',
              )
          cli.write_text(text)

          sh = Path('packages/desktop/bin/paseo')
          if sh.exists():
              text = sh.read_text()
              if 'CODIUS_DESKTOP_CLI=1' not in text:
                  lines = text.splitlines()
                  insert = 1 if lines and lines[0].startswith('#!') else 0
                  lines.insert(insert, 'export CODIUS_DESKTOP_CLI=1')
                  sh.write_text('\n'.join(lines) + '\n')

          cmd = Path('packages/desktop/bin/paseo.cmd')
          if cmd.exists():
              text = cmd.read_text()
              if 'CODIUS_DESKTOP_CLI=1' not in text:
                  text = text.replace('@echo off', '@echo off\r\nset "CODIUS_DESKTOP_CLI=1"', 1)
                  cmd.write_text(text)

          prefs = Path('packages/app/src/create-agent-preferences/preferences.ts')
          text = prefs.read_text()
          text = re.sub(
              r'export const DEFAULT_FORM_PREFERENCES: FormPreferences = \{\s*provider:\s*["\']codius["\'],?\s*\};',
              'export const DEFAULT_FORM_PREFERENCES: FormPreferences = {};',
              text,
              flags=re.S,
          )
          prefs.write_text(text)

          resolver = Path('packages/app/src/provider-selection/resolve-agent-form.ts')
          text = resolver.read_text()
          marker = '  return currentProvider;\n}\n\nfunction resolveModeId'
          replacement = '  if (!currentProvider && allowedProviderMap.has("codius")) {\n    return "codius";\n  }\n  return currentProvider;\n}\n\nfunction resolveModeId'
          if marker in text and 'allowedProviderMap.has("codius")' not in text:
              text = text.replace(marker, replacement, 1)
          resolver.write_text(text)

          home = Path('packages/server/src/server/paseo-home.ts')
          text = home.read_text()
          if 'ensureCodiusHomeDefaults(resolved);' in text and 'CODIUS_DESKTOP_MANAGED' not in text:
              text = text.replace(
                  '  ensureCodiusHomeDefaults(resolved);',
                  '  if (env.CODIUS_DESKTOP_MANAGED === "1" || env.PASEO_DESKTOP_MANAGED === "1") {\n    ensureCodiusHomeDefaults(resolved);\n  }',
              )
          home.write_text(text)

          preload = Path('packages/desktop/src/preload.ts')
          preload.write_text(preload.read_text().replace('persist:paseo-browser', 'persist:codius-browser'))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and format
        run: |
          npm ci --no-audit --no-fund
          npm run format
          npm run format:check

      - name: Verify compatibility and product layers
        run: |
          npm run typecheck
          npm run test --workspace=@getpaseo/protocol
          npm run test --workspace=@getpaseo/server -- src/server/paseo-home.test.ts src/server/agent/provider-registry.test.ts
          npm run test --workspace=@getpaseo/desktop
          npm run test --workspace=@getpaseo/app
          npm run test --workspace=@getpaseo/cli
          npm run build:server
          npm run build:main --workspace=@getpaseo/desktop

      - name: Commit verified repair
        shell: bash
        run: |
          rm -f .github/workflows/codius-compatibility-repair.yml
          rm -f .github/workflows/codius-release-rescue.yml
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          git commit -m "fix: preserve upstream daemon compatibility behind Codius Desktop"
          git push origin HEAD:feat/codius-productization
          gh pr comment 1 --repo prismosoft/codius-desktop --body "Compatibility rescue passed, including the inherited daemon CLI suite. The public agent remains codius and the Desktop controller remains codiusctl."
