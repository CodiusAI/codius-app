name: Apply Codius Desktop Product Layer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: codius-desktop-productization-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  productize:
    if: ${{ github.head_ref == 'feat/codius-productization' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out writable feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Recover productization tool and prepare official Codius artwork
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib, re, subprocess, zlib
          source = subprocess.check_output([
              "git", "show",
              "8c87279721217726b2337010097d3c3e1ee6a073:.github/workflows/codius-productization.yml",
          ], text=True)
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', source)
          if not match:
              raise SystemExit("Unable to recover the Codius Desktop productization payload")
          pathlib.Path('/tmp/apply_codius_desktop.py').write_bytes(
              zlib.decompress(base64.b64decode(match.group(1)))
          )
          PY
          cat > /tmp/codius-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="title">
            <title>Codius</title>
            <path fill="#111827" d="M17.002,2H7C4.243,2,2,4.243,2,6.999v10.003C2,19.758,4.243,22,7,22h10.002C19.758,22,22,19.758,22,17.002V6.999C22,4.243,19.758,2,17.002,2z M9.446,15.995c0.553,0,1,0.448,1,1s-0.447,1-1,1H7c-0.553,0-1-0.448-1-1V7c0-0.552,0.447-1,1-1h2.446c0.553,0,1,0.448,1,1s-0.447,1-1,1H8v7.995H9.446z M18,16.995c0,0.552-0.447,1-1,1h-2.446c-0.553,0-1-0.448-1-1s0.447-1,1-1H16V8h-1.446c-0.553,0-1-0.448-1-1s0.447-1,1-1H17c0.553,0,1,0.448,1,1V16.995z"/>
          </svg>
          SVG
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='/tmp/codius-icon.svg',
              write_to='/tmp/codius-icon.png',
              output_width=1024,
              output_height=1024,
          )
          PY

      - name: Apply Codius Desktop product layer
        run: |
          python /tmp/apply_codius_desktop.py . \
            --no-branch \
            --allow-dirty \
            --logo-svg /tmp/codius-icon.svg \
            --logo-png /tmp/codius-icon.png

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check all workspaces
        run: npm run typecheck

      - name: Run provider protocol tests
        run: npm run test --workspace=@getpaseo/protocol

      - name: Run Codius default-provider test
        run: npm run test --workspace=@getpaseo/app -- src/provider-selection/codius-default.test.ts

      - name: Commit validated productization
        shell: bash
        run: |
          git config user.name "Codius Automation"
          git config user.email "actions@codius.ai"
          git add -A
          if git diff --cached --quiet; then
            echo "No productization changes to commit."
            exit 0
          fi
          git commit -m "feat: productize Paseo fork as Codius Desktop"
          git push origin HEAD:feat/codius-productization
