name: Verify and finalize Codius Desktop

"on":
  push:
    branches:
      - feat/codius-productization

permissions:
  contents: write

concurrency:
  group: codius-desktop-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch official Codius artwork
        shell: bash
        run: |
          mkdir -p assets
          curl -fsSL \
            https://raw.githubusercontent.com/prismosoft/codius-cli/feat/codius-productization/assets/codius-logo.svg \
            -o assets/codius-logo.svg

      - name: Apply safe Codius Desktop product layer
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding="utf-8")

          def update_json(path: str, fn) -> None:
              data = json.loads(read(path))
              fn(data)
              write(path, json.dumps(data, indent=2, ensure_ascii=False) + "\n")

          def root_pkg(data: dict) -> None:
              data["name"] = "codius-desktop"
              data["description"] = "Codius Desktop — an open-source command center for parallel coding agents"
              data["homepage"] = "https://codius.ai"
              data["repository"] = {"type": "git", "url": "https://github.com/prismosoft/codius-desktop.git"}
              data["bugs"] = {"url": "https://github.com/prismosoft/codius-desktop/issues"}
          update_json("package.json", root_pkg)

          readme = r'''<p align="center">
  <img src="assets/codius-logo.svg" alt="Codius" width="420" />
</p>

<h1 align="center">Codius Desktop</h1>

<p align="center">
  An open-source desktop command center for parallel coding agents, with Codius built in as the default provider.
</p>

> **Development status:** active productization branch. Codius Desktop is derived from
> [Paseo](https://github.com/getpaseo/paseo) and preserves its AGPL-3.0 license and notices.

## Overview

Codius Desktop combines agent conversations, isolated Git worktrees, terminals, diffs,
Git operations, schedules, and a visible inline browser in one workspace. Its first-party
agent is **Codius CLI**, launched through Agent Client Protocol (ACP):

```text
Codius Desktop  →  codius acp  →  Codius API
```

Codius is the fresh-install default. Codex, Claude Code, GitHub Copilot, OpenCode, Pi,
Oh My Pi, and custom ACP providers remain available, and an explicit user selection is
remembered rather than being reset to Codius.

## Environments

| Environment | Website | OpenAI-compatible API |
|---|---|---|
| Development | `https://dev.codius.dev` | `https://devapi.codius.dev/v1` |
| Production | `https://codius.ai` | `https://api.codius.ai/v1` |

Codius Desktop never embeds Runware or another infrastructure provider credential. API
keys, subscriptions, model routing, and usage accounting are owned by Codius services.

## Codius provider

Install and authenticate Codius CLI:

```bash
codius --version
codius providers login --provider codius
```

Desktop starts the provider with:

```bash
codius acp
```

ACP reports available models and modes dynamically. Desktop-provided MCP tools—including
the visible browser tools—are made available to the local Codius agent.

## Inline browser and automation

The browser is a real embedded view, not a screenshot. An approved agent can navigate,
inspect, click, type, upload files, capture screenshots, and inspect console/network
state in the same tab the user sees and can take over manually.

## Development

Requirements: Node.js 22, npm, Git, and a local `codius` executable for provider tests.

```bash
git clone https://github.com/prismosoft/codius-desktop.git
cd codius-desktop
npm ci
npm run typecheck
npm run dev
```

For the development API:

```bash
export CODIUS_ENV=development
codius providers login --provider codius
```

## Command names and local data

- `codius` is the coding-agent CLI.
- `codiusctl` is the optional Desktop daemon-management CLI.
- New Desktop data defaults to `~/.codius`.
- `PASEO_HOME` and legacy Paseo browser-profile storage remain readable for migration.
- The upstream Paseo relay is disabled by default until a Codius-operated relay is configured.

## Upstream and license

Codius Desktop is a modified Paseo distribution. Covered source remains licensed under
**AGPL-3.0**. Preserve the upstream copyright, license, source offer, and modification
notices in distributed builds.

Repositories:

- Service/API: `prismosoft/codius`
- CLI: `prismosoft/codius-cli`
- Desktop: `prismosoft/codius-desktop`
'''
          write("README.md", readme)

          manifest_path = "packages/protocol/src/provider-manifest.ts"
          manifest = read(manifest_path)
          if 'id: "codius"' not in manifest:
              marker = "export const AGENT_PROVIDER_DEFINITIONS: AgentProviderDefinition[] = [\n"
              block = '''  {
    id: "codius",
    label: "Codius",
    description: "Codius coding agent with subscription models, ACP tools, and dynamic model discovery",
    enabledByDefault: true,
    defaultModeId: null,
    modes: OPENCODE_MODES,
    voice: {
      enabled: true,
      defaultModeId: "build",
    },
  },
'''
              if marker not in manifest:
                  raise RuntimeError("AGENT_PROVIDER_DEFINITIONS marker not found")
              manifest = manifest.replace(marker, marker + block, 1)
          write(manifest_path, manifest)

          registry_path = "packages/server/src/server/agent/provider-registry.ts"
          registry = read(registry_path)
          if "codius:" not in registry:
              marker = "const PROVIDER_CLIENT_FACTORIES: Record<string, ProviderClientFactory> = {\n"
              block = '''  codius: (logger, runtimeSettings) =>
    new GenericACPAgentClient({
      logger,
      command: getCodiusACPCommand(runtimeSettings),
      env: runtimeSettings?.env,
      providerId: "codius",
      label: "Codius",
      providerParams: { supportsMcpServers: true },
    }),
'''
              if marker not in registry:
                  raise RuntimeError("PROVIDER_CLIENT_FACTORIES marker not found")
              registry = registry.replace(marker, marker + block, 1)
          if "function getCodiusACPCommand" not in registry:
              marker = "function getCursorACPCommand(\n"
              helper = '''function getCodiusACPCommand(
  runtimeSettings: ProviderRuntimeSettings | undefined,
): [string, ...string[]] {
  if (
    runtimeSettings?.command?.mode === "replace" &&
    isNonEmptyStringArray(runtimeSettings.command.argv)
  ) {
    return runtimeSettings.command.argv;
  }

  return ["codius", "acp"];
}

'''
              if marker not in registry:
                  raise RuntimeError("Cursor ACP helper marker not found")
              registry = registry.replace(marker, helper + marker, 1)
          write(registry_path, registry)

          icon_names_path = "packages/protocol/src/provider-icon-names.ts"
          icon_names = read(icon_names_path)
          if '"codius"' not in icon_names:
              icon_names = icon_names.replace(
                  "export const BUILTIN_PROVIDER_ICON_NAMES = [\n",
                  'export const BUILTIN_PROVIDER_ICON_NAMES = [\n  "codius",\n',
                  1,
              )
          write(icon_names_path, icon_names)

          logo = read("assets/codius-logo.svg")
          for rel in [
              "packages/app/src/assets/provider-icons/codius.svg",
              "packages/website/public/codius-logo.svg",
              "packages/desktop/resources/codius-logo.svg",
          ]:
              write(rel, logo)

          home_path = "packages/server/src/server/paseo-home.ts"
          home = read(home_path)
          home = home.replace(
              'const raw = env.PASEO_HOME ?? "~/.paseo";',
              'const raw = env.CODIUS_HOME ?? env.PASEO_HOME ?? "~/.codius";',
          )
          write(home_path, home)

          # New Codius browser profile with explicit legacy Paseo migration paths.
          for path in list((ROOT / "packages/desktop/src").rglob("*.ts")) + list((ROOT / "packages/desktop/src").rglob("*.tsx")):
              value = path.read_text(encoding="utf-8")
              if "persist:paseo-browser" not in value and "LEGACY_PASEO_BROWSER_PROFILE_PARTITION" not in value:
                  continue
              value = value.replace(
                  'export const PASEO_BROWSER_PROFILE_PARTITION = "persist:paseo-browser";',
                  'export const PASEO_BROWSER_PROFILE_PARTITION = "persist:codius-browser";\nexport const LEGACY_PASEO_BROWSER_PROFILE_PARTITION = "persist:paseo-browser";',
              )
              if "LEGACY_PASEO_BROWSER_PROFILE_PARTITION" in value:
                  value = value.replace(
                      "sessions.fromPartition(`${PASEO_BROWSER_PROFILE_PARTITION}-${browserId}`)",
                      "sessions.fromPartition(`${LEGACY_PASEO_BROWSER_PROFILE_PARTITION}-${browserId}`)",
                  )
                  legacy_entry = "sessions.fromPartition(LEGACY_PASEO_BROWSER_PROFILE_PARTITION),"
                  if "getPaseoBrowserProfileSessions" in value and legacy_entry not in value:
                      value = value.replace(
                          "getPaseoBrowserProfileSession(sessions),\n",
                          "getPaseoBrowserProfileSession(sessions),\n    sessions.fromPartition(LEGACY_PASEO_BROWSER_PROFILE_PARTITION),\n",
                          1,
                      )
              path.write_text(value, encoding="utf-8")

          def desktop_cli_pkg(data: dict) -> None:
              data["description"] = "Codius Desktop CLI — control local coding-agent workspaces and the daemon"
              data["bin"] = {"codiusctl": "bin/codiusctl"}
          update_json("packages/cli/package.json", desktop_cli_pkg)

          old_shim = ROOT / "packages/cli/bin/paseo"
          new_shim = ROOT / "packages/cli/bin/codiusctl"
          if old_shim.exists() and not new_shim.exists():
              new_shim.write_text(old_shim.read_text(encoding="utf-8"), encoding="utf-8")

          cli_index_path = "packages/cli/src/index.ts"
          cli_index = read(cli_index_path)
          cli_index = cli_index.replace('.name("paseo")', '.name("codiusctl")')
          cli_index = cli_index.replace('"Paseo CLI - control your AI coding agents from the command line"', '"Codius Desktop CLI - control your coding-agent workspaces from the command line"')
          cli_index = cli_index.replace('alias for "paseo daemon', 'alias for "codiusctl daemon')
          cli_index = cli_index.replace("Paseo home directory (default: ~/.paseo)", "Codius home directory (default: ~/.codius)")
          cli_index = cli_index.replace("register it as a Paseo workspace", "register it as a Codius workspace")
          write(cli_index_path, cli_index)

          run_path = ROOT / "packages/cli/src/run.ts"
          if run_path.exists():
              value = run_path.read_text(encoding="utf-8")
              value = value.replace('process.argv[1] ?? "paseo"', 'process.argv[1] ?? "codiusctl"')
              run_path.write_text(value, encoding="utf-8")

          paths_path = ROOT / "packages/desktop/src/integrations/cli-install/paths.ts"
          if paths_path.exists():
              value = paths_path.read_text(encoding="utf-8")
              value = value.replace('"paseo.cmd" : "paseo"', '"codiusctl.cmd" : "codiusctl"')
              value = value.replace('"paseo.cmd"', '"codiusctl.cmd"')
              # Only exact filename strings; preserve internal identifiers.
              value = re.sub(r'(?<![A-Za-z0-9_])"paseo"(?![A-Za-z0-9_])', '"codiusctl"', value)
              paths_path.write_text(value, encoding="utf-8")

          install_path = ROOT / "packages/desktop/src/integrations/cli-install/index.ts"
          if install_path.exists():
              value = install_path.read_text(encoding="utf-8")
              value = value.replace("Paseo CLI not found", "Codius Desktop CLI not found")
              value = value.replace("is Paseo installed?", "is Codius Desktop installed?")
              install_path.write_text(value, encoding="utf-8")

          # Safe product-facing string replacements only. Internal TypeScript symbols,
          # environment variables, and @getpaseo workspace package names remain stable.
          text_ext = {".ts", ".tsx", ".js", ".mjs", ".cjs", ".json", ".yml", ".yaml", ".toml", ".html", ".md", ".nix", ".plist", ".desktop"}
          for base in [ROOT / "packages/desktop", ROOT / "packages/app", ROOT / "packages/cli"]:
              if not base.exists():
                  continue
              for path in base.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in text_ext:
                      continue
                  value = path.read_text(encoding="utf-8")
                  next_value = value
                  next_value = next_value.replace('"Paseo"', '"Codius"')
                  next_value = next_value.replace("'Paseo'", "'Codius'")
                  next_value = next_value.replace("Paseo Desktop", "Codius Desktop")
                  next_value = next_value.replace("https://paseo.sh", "https://codius.ai")
                  next_value = next_value.replace("https://github.com/getpaseo/paseo", "https://github.com/prismosoft/codius-desktop")
                  next_value = next_value.replace("getpaseo/paseo", "prismosoft/codius-desktop")
                  next_value = next_value.replace("com.getpaseo.paseo", "ai.codius.desktop")
                  next_value = next_value.replace("com.paseo.app", "ai.codius.desktop")
                  next_value = next_value.replace('"paseo://', '"codius://')
                  next_value = next_value.replace("'paseo://", "'codius://")
                  if next_value != value:
                      path.write_text(next_value, encoding="utf-8")

          # JSON packaging metadata can be rebranded recursively without touching
          # dependency package names or scripts.
          desktop_package = ROOT / "packages/desktop/package.json"
          if desktop_package.exists():
              data = json.loads(desktop_package.read_text(encoding="utf-8"))
              def visit(value, key=""):
                  if isinstance(value, dict):
                      return {k: visit(v, k) for k, v in value.items()}
                  if isinstance(value, list):
                      return [visit(v, key) for v in value]
                  if not isinstance(value, str):
                      return value
                  if value.startswith("@getpaseo/"):
                      return value
                  if key in {"productName", "description", "homepage", "appId", "artifactName", "executableName", "name", "scheme"}:
                      value = value.replace("Paseo", "Codius")
                      value = value.replace("paseo-desktop", "codius-desktop")
                      value = value.replace("com.getpaseo.paseo", "ai.codius.desktop")
                      value = value.replace("com.paseo.app", "ai.codius.desktop")
                      if value == "paseo":
                          value = "codius"
                  return value.replace("https://paseo.sh", "https://codius.ai").replace("getpaseo/paseo", "prismosoft/codius-desktop")
              data = visit(data)
              desktop_package.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          # Exact string-literal branding in Electron main without renaming imported
          # functions such as resolvePaseoHome.
          main_path = ROOT / "packages/desktop/src/main.ts"
          if main_path.exists():
              value = main_path.read_text(encoding="utf-8")
              value = value.replace('"Paseo"', '"Codius"').replace("'Paseo'", "'Codius'")
              value = value.replace('"paseo://', '"codius://').replace("'paseo://", "'codius://")
              main_path.write_text(value, encoding="utf-8")

          # Prefer Codius only when an optional provider-selection chain would
          # otherwise resolve to null/undefined. Explicit and persisted values stay first.
          patched_default = 0
          for path in (ROOT / "packages/app/src").rglob("*.ts*"):
              value = path.read_text(encoding="utf-8")
              if "initialProvider" not in value and "initialProviderId" not in value:
                  continue
              next_value = value
              chain = re.compile(
                  r"((?:initialProvider(?:Id)?)[\s\S]{0,420}?(?:currentProvider(?:Id)?|preferredProvider(?:Id)?|savedProvider(?:Id)?|lastProvider(?:Id)?))(\s*;)",
                  re.MULTILINE,
              )
              match = chain.search(next_value)
              if match and '?? "codius"' not in match.group(0):
                  replacement = match.group(1) + ' ?? "codius"' + match.group(2)
                  next_value = next_value[: match.start()] + replacement + next_value[match.end() :]
                  patched_default += 1
              if next_value != value:
                  path.write_text(next_value, encoding="utf-8")

          # Disable upstream relay as a default. User-configured relay settings remain.
          for rel in [
              "packages/server/src/server/persisted-config.ts",
              "packages/desktop/src/settings/desktop-settings.ts",
              "packages/desktop/src/settings/desktop-settings-electron.ts",
          ]:
              path = ROOT / rel
              if not path.exists():
                  continue
              value = path.read_text(encoding="utf-8")
              if "relay" in value.lower():
                  value = value.replace("relayEnabled: true", "relayEnabled: false")
                  value = value.replace("enabledByDefault: true", "enabledByDefault: false") if "relay" in rel.lower() else value
              path.write_text(value, encoding="utf-8")

          test = '''import { describe, expect, it } from "vitest";
import { AGENT_PROVIDER_DEFINITIONS } from "./provider-manifest";

describe("Codius provider", () => {
  it("is the first built-in provider", () => {
    expect(AGENT_PROVIDER_DEFINITIONS[0]?.id).toBe("codius");
  });

  it("preserves other built-in providers", () => {
    const ids = AGENT_PROVIDER_DEFINITIONS.map((provider) => provider.id);
    expect(ids).toContain("codex");
    expect(ids).toContain("claude");
    expect(ids).toContain("opencode");
  });
});
'''
          write("packages/protocol/src/codius-provider.test.ts", test)

          doc = '''# Codius ACP provider

Codius Desktop starts the first-party provider with `codius acp`. The ACP process owns
Codius API authentication and reports its models and modes dynamically. Desktop keeps
all other built-in providers available and passes approved MCP tools—including inline
browser automation—to the local Codius agent.

Development API: `https://devapi.codius.dev/v1`  
Production API: `https://api.codius.ai/v1`
'''
          write("docs/codius-provider.md", doc)

          required = {
              "packages/protocol/src/provider-manifest.ts": ['id: "codius"', 'label: "Codius"'],
              "packages/server/src/server/agent/provider-registry.ts": ['codius:', 'return ["codius", "acp"]'],
              "packages/server/src/server/paseo-home.ts": ["CODIUS_HOME", '"~/.codius"'],
              "packages/cli/package.json": ['"codiusctl"'],
              "README.md": ["Codius Desktop", "codius acp", "devapi.codius.dev/v1"],
          }
          for rel, needles in required.items():
              value = read(rel)
              for needle in needles:
                  if needle not in value:
                      raise RuntimeError(f"Missing {needle!r} in {rel}")
          PY

          chmod +x packages/cli/bin/codiusctl || true
          git diff --check

      - name: Generate branded desktop icon formats
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick libicns-utils
          rsvg-convert -w 1024 -h 1024 assets/codius-logo.svg -o /tmp/codius-1024.png
          mkdir -p packages/desktop/resources
          cp /tmp/codius-1024.png packages/desktop/resources/icon.png
          convert /tmp/codius-1024.png -define icon:auto-resize=256,128,64,48,32,16 packages/desktop/resources/icon.ico
          work=/tmp/codius-icns
          rm -rf "$work" && mkdir -p "$work"
          for size in 16 32 64 128 256 512 1024; do
            rsvg-convert -w "$size" -h "$size" assets/codius-logo.svg -o "$work/icon-${size}.png"
          done
          png2icns packages/desktop/resources/icon.icns \
            "$work/icon-16.png" "$work/icon-32.png" "$work/icon-64.png" \
            "$work/icon-128.png" "$work/icon-256.png" "$work/icon-512.png" "$work/icon-1024.png"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck workspace
        run: npm run typecheck

      - name: Test Codius provider manifest
        run: npx vitest run packages/protocol/src/codius-provider.test.ts

      - name: Remove temporary automation and commit
        shell: bash
        run: |
          rm -f \
            .github/workflows/codius-productization.yml \
            .github/workflows/codius-desktop-productization.yml \
            .github/workflows/codius-finalize.yml \
            .github/workflows/codius-desktop-finalize.yml \
            .github/workflows/codius-desktop-finalize-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add Codius Desktop product layer and default ACP provider"
          git push origin HEAD:feat/codius-productization
