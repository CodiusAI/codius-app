name: Codius release diagnostics

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/codius-release-diagnostics.yml

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
  PASEO_DICTATION_ENABLED: "0"
  PASEO_VOICE_MODE_ENABLED: "0"
  CODIUS_SEED_DEFAULTS: "0"

jobs:
  cli-shard:
    name: cli shard ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/npm-retry.mjs ci
      - run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai
      - id: test
        shell: bash
        env:
          PASEO_CLI_TEST_SHARD: ${{ matrix.shard }}
          PASEO_CLI_TEST_SHARD_TOTAL: "3"
        run: |
          mkdir -p diagnostics
          set +e
          npm run test --workspace=@getpaseo/cli > "diagnostics/cli-shard-${PASEO_CLI_TEST_SHARD}.log" 2>&1
          status=$?
          echo "$status" > "diagnostics/cli-shard-${PASEO_CLI_TEST_SHARD}.exit"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codius-desktop-cli-shard-${{ matrix.shard }}
          retention-days: 3
          path: diagnostics
      - name: Preserve failing status
        shell: bash
        run: |
          status=$(cat "diagnostics/cli-shard-${{ matrix.shard }}.exit")
          exit "$status"
