name: Codius release diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/codius-release-diagnostics.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  cli-shard-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/npm-retry.mjs ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai
      - id: diagnose
        shell: bash
        run: |
          set +e
          PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD=0 PASEO_DICTATION_ENABLED=0 PASEO_VOICE_MODE_ENABLED=0 PASEO_CLI_TEST_SHARD=1 PASEO_CLI_TEST_SHARD_TOTAL=3 \
            npm run test --workspace=@getpaseo/cli > /tmp/diagnostic.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish CLI diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.diagnose.outputs.status }}
        shell: bash
        run: |
          marker='<!-- codius-diagnostic-cli-shard-1 -->'
          { echo "$marker"; echo '## CLI shard 1 diagnostic'; echo; echo "Exit status: \`$STATUS\`"; echo; echo '```text'; tail -n 180 /tmp/diagnostic.log | tail -c 50000; echo; echo '```'; } > /tmp/comment.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/1/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)
          if [[ -n "$existing" ]]; then jq -n --rawfile body /tmp/comment.md '{body:$body}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input -; else gh pr comment 1 --body-file /tmp/comment.md; fi
      - if: steps.diagnose.outputs.status != '0'
        run: exit 1

  playwright-shard-2:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/npm-retry.mjs ci
      - run: npx playwright install chromium
      - run: npm run build:app-deps
      - run: npm run build:server
      - run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai
      - id: diagnose
        shell: bash
        run: |
          set +e
          npm run test:e2e --workspace=@getpaseo/app -- --shard=2/4 > /tmp/diagnostic.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish Playwright diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.diagnose.outputs.status }}
        shell: bash
        run: |
          marker='<!-- codius-diagnostic-playwright-2 -->'
          { echo "$marker"; echo '## Playwright shard 2 diagnostic'; echo; echo "Exit status: \`$STATUS\`"; echo; echo '```text'; tail -n 180 /tmp/diagnostic.log | tail -c 50000; echo; echo '```'; } > /tmp/comment.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/1/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)
          if [[ -n "$existing" ]]; then jq -n --rawfile body /tmp/comment.md '{body:$body}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input -; else gh pr comment 1 --body-file /tmp/comment.md; fi
      - if: steps.diagnose.outputs.status != '0'
        run: exit 1

  nix-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: ./scripts/update-nix.sh
      - id: diagnose
        shell: bash
        run: |
          set +e
          nix build .#default -o result --print-build-logs > /tmp/diagnostic.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish Nix diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.diagnose.outputs.status }}
        shell: bash
        run: |
          marker='<!-- codius-diagnostic-nix -->'
          { echo "$marker"; echo '## Nix build diagnostic'; echo; echo "Exit status: \`$STATUS\`"; echo; echo '```text'; tail -n 180 /tmp/diagnostic.log | tail -c 50000; echo; echo '```'; } > /tmp/comment.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/1/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)
          if [[ -n "$existing" ]]; then jq -n --rawfile body /tmp/comment.md '{body:$body}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input -; else gh pr comment 1 --body-file /tmp/comment.md; fi
      - if: steps.diagnose.outputs.status != '0'
        run: exit 1

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
      - uses: docker/setup-buildx-action@v4
      - id: diagnose
        shell: bash
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          docker buildx build --progress=plain --platform linux/amd64 --build-arg PASEO_VERSION="$version" -f docker/base/Dockerfile . > /tmp/diagnostic.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish Docker diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.diagnose.outputs.status }}
        shell: bash
        run: |
          marker='<!-- codius-diagnostic-docker -->'
          { echo "$marker"; echo '## Docker build diagnostic'; echo; echo "Exit status: \`$STATUS\`"; echo; echo '```text'; tail -n 180 /tmp/diagnostic.log | tail -c 50000; echo; echo '```'; } > /tmp/comment.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/1/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)
          if [[ -n "$existing" ]]; then jq -n --rawfile body /tmp/comment.md '{body:$body}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input -; else gh pr comment 1 --body-file /tmp/comment.md; fi
      - if: steps.diagnose.outputs.status != '0'
        run: exit 1
