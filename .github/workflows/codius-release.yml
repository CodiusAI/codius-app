name: Release Codius

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, without the leading v
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as prerelease
        required: false
        default: false
        type: boolean
      unsigned:
        description: Build unsigned artifacts for release-pipeline testing
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: codius-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CI: "1"
      ONNXRUNTIME_NODE_INSTALL: skip
      CODIUS_UNSIGNED: ${{ ((github.event_name == 'workflow_dispatch' && inputs.unsigned) || contains(github.ref_name, '-unsigned.')) && 'true' || 'false' }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.unsigned) || contains(github.ref_name, '-unsigned.')) && 'false' || 'true' }}
      WIN_CSC_LINK: ${{ secrets.CODIUS_WINDOWS_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.CODIUS_WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure Windows signing variables
        if: runner.os == 'Windows' && env.CODIUS_UNSIGNED != 'true'
        shell: pwsh
        run: |
          if ($env:WIN_CSC_LINK) { "CSC_LINK=$env:WIN_CSC_LINK" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          if ($env:WIN_CSC_KEY_PASSWORD) { "CSC_KEY_PASSWORD=$env:WIN_CSC_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }

      - name: Configure macOS signing variables
        if: runner.os == 'macOS' && env.CODIUS_UNSIGNED != 'true'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.CODIUS_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CODIUS_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.CODIUS_APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.CODIUS_APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.CODIUS_APPLE_TEAM_ID }}
        run: |
          test -n "$MAC_CSC_LINK"
          echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_ID=$MAC_APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$MAC_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$MAC_APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Bundle Codius CLI (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODIUS_CLI_RELEASE: v1.18.4-codius.2
        run: |
          case "${{ matrix.artifact }}" in
            macos-arm64)
              asset="codius-darwin-arm64.zip"
              destination="packages/desktop/vendor/codius/darwin-arm64"
              ;;
            macos-x64)
              asset="codius-darwin-x64.zip"
              destination="packages/desktop/vendor/codius/darwin-x64"
              ;;
            linux)
              asset="codius-linux-x64.tar.gz"
              destination="packages/desktop/vendor/codius/linux-x64"
              ;;
          esac
          mkdir -p "$destination" "$RUNNER_TEMP/codius-cli"
          gh release download "$CODIUS_CLI_RELEASE" \
            --repo prismosoft/codius-cli \
            --pattern "$asset" \
            --dir "$RUNNER_TEMP/codius-cli"
          if [[ "$asset" == *.zip ]]; then
            unzip -q "$RUNNER_TEMP/codius-cli/$asset" -d "$destination"
          else
            tar -xzf "$RUNNER_TEMP/codius-cli/$asset" -C "$destination"
          fi
          chmod +x "$destination/codius"
          "$destination/codius" --version
          "$destination/codius" acp --help >/dev/null
          CODIUS_ACP_BIN="$destination/codius" \
            CODIUS_ACP_REQUIRE=1 \
            CODIUS_ENV=production \
            node packages/desktop/scripts/codius-acp-integration.mjs

      - name: Bundle Codius CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CODIUS_CLI_RELEASE: v1.18.4-codius.2
        run: |
          foreach ($arch in @("x64", "arm64")) {
            $asset = "codius-windows-$arch.zip"
            $download = Join-Path $env:RUNNER_TEMP $asset
            $destination = "packages/desktop/vendor/codius/win32-$arch"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            gh release download $env:CODIUS_CLI_RELEASE `
              --repo prismosoft/codius-cli `
              --pattern $asset `
              --dir $env:RUNNER_TEMP
            Expand-Archive -Path $download -DestinationPath $destination -Force
          }
          & "packages/desktop/vendor/codius/win32-x64/codius.exe" --version
          & "packages/desktop/vendor/codius/win32-x64/codius.exe" acp --help | Out-Null
          $env:CODIUS_ACP_BIN = "packages/desktop/vendor/codius/win32-x64/codius.exe"
          $env:CODIUS_ACP_REQUIRE = "1"
          $env:CODIUS_ENV = "production"
          node packages/desktop/scripts/codius-acp-integration.mjs

      - name: Set desktop package version
        shell: bash
        env:
          CODIUS_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJsonPath = 'packages/desktop/package.json';
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
          packageJson.version = process.env.CODIUS_DESKTOP_VERSION;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Build workspace dependencies
        run: |
          npm run build:server
          npm run build:app-deps
          npm run build:main --workspace=@codius-ai/desktop

      - name: Validate release source
        run: |
          npm run format:check
          npm run typecheck
          npm run test --workspace=@codius-ai/protocol
          npm run test --workspace=@codius-ai/desktop

      - name: Build Codius packages
        run: npm run build:desktop -- --publish never

      - name: Verify public artifact names
        shell: bash
        run: |
          find packages/desktop/release -maxdepth 1 -type f -print
          test -n "$(find packages/desktop/release -maxdepth 1 -type f -iname 'Codius-*' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: codius-desktop-${{ matrix.artifact }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.rpm
            packages/desktop/release/*.tar.gz
            packages/desktop/release/*.exe
            packages/desktop/release/*.yml
            packages/desktop/release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codius-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; else version="${{ inputs.version }}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          prerelease=""
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "true" ]]; then
            prerelease="--prerelease"
          elif [[ "$tag" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release view "$tag" --repo prismosoft/codius-desktop >/dev/null 2>&1 || gh release create "$tag" --repo prismosoft/codius-desktop --title "Codius $tag" --generate-notes $prerelease
          find release-assets -type f -print0 | xargs -0 gh release upload "$tag" --repo prismosoft/codius-desktop --clobber
