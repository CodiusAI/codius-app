name: Fix Codius Home Default Tests

on:
  push:
    branches: [main]
    paths: [.github/workflows/codius-home-test-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Update managed-home tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/server/src/server/paseo-home.test.ts')
          text=p.read_text()
          text=text.replace('resolvePaseoHome({ CODIUS_HOME: codiusHome })','resolvePaseoHome({ CODIUS_HOME: codiusHome, CODIUS_DESKTOP_MANAGED: "1" })')
          if 'does not seed a config for an unmanaged home lookup' not in text:
              insertion='''

  test("does not seed a config for an unmanaged home lookup", () => {
    const parent = mkdtempSync(path.join(tmpdir(), "codius-unmanaged-home-"));
    const codiusHome = path.join(parent, "home");
    try {
      expect(resolvePaseoHome({ CODIUS_HOME: codiusHome })).toBe(codiusHome);
      expect(existsSync(path.join(codiusHome, "config.json"))).toBe(false);
    } finally {
      rmSync(parent, { recursive: true, force: true });
    }
  });
'''
              text=text.replace('\n});\n', insertion+'\n});\n', 1)
          text=text.replace('import { mkdtempSync, readFileSync, rmSync, statSync } from "node:fs";','import { existsSync, mkdtempSync, readFileSync, rmSync, statSync } from "node:fs";')
          p.write_text(text)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - run: npm run test --workspace=@getpaseo/server -- src/server/paseo-home.test.ts
      - name: Commit test correction
        shell: bash
        run: |
          rm -f .github/workflows/codius-home-test-fix.yml
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          git commit -m "test: cover managed Codius home initialization"
          git push origin HEAD:main
