name: Codius Desktop Release Gate

on:
  push:
    branches:
      - feat/codius-productization
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codius-desktop-release-gate
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release-gate]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      ONNXRUNTIME_NODE_INSTALL: skip
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out productization branch
        uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply repository formatting
        run: npm run format

      - name: Persist formatting corrections
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          git commit -m "style: normalize Codius Desktop productization [skip release-gate]"
          git push origin HEAD:feat/codius-productization

      - name: Check formatting
        run: npm run format:check

      - name: Type-check all workspaces
        run: npm run typecheck

      - name: Run protocol tests
        run: npm run test --workspace=@getpaseo/protocol

      - name: Run server default-provider tests
        run: npm run test --workspace=@getpaseo/server -- src/server/paseo-home.test.ts src/server/agent/provider-registry.test.ts

      - name: Run desktop unit tests
        run: npm run test --workspace=@getpaseo/desktop

      - name: Run app unit tests
        run: npm run test --workspace=@getpaseo/app

      - name: Build server stack
        run: npm run build:server

      - name: Build Electron main process
        run: npm run build:main --workspace=@getpaseo/desktop

      - name: Audit Codius provider and package contract
        shell: bash
        run: |
          grep -q 'command: \["codius", "acp"\]' packages/server/src/server/codius-defaults.ts
          grep -q 'provider: "codius"' packages/app/src/create-agent-preferences/preferences.ts
          grep -q 'ai.codius.desktop' packages/desktop/electron-builder.yml
          grep -q 'productName: Codius Desktop' packages/desktop/electron-builder.yml
          grep -q 'owner: prismosoft' packages/desktop/electron-builder.yml
          grep -q 'repo: codius-desktop' packages/desktop/electron-builder.yml
          grep -q 'persist:codius-browser' packages/desktop/src/features/browser-profile.ts
          grep -q 'persist:codius-browser' packages/desktop/src/preload.ts
          grep -q 'codius:' packages/protocol/src/agent-deep-link.ts
          test -s packages/desktop/assets/icon.png
          test -s packages/desktop/assets/icon.ico
          test -s packages/desktop/assets/icon.icns
          test -f assets/codius-logo.svg

      - name: Remove temporary productization automation
        shell: bash
        run: |
          rm -f .github/workflows/codius-productization.yml
          rm -f .github/workflows/codius-productization-pr.yml
          rm -f .github/workflows/codius-release-gate.yml
          rm -f .github/workflows/codius-diagnostics.yml
          rm -f CODIUS_VALIDATION.md VALIDATION.md
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize Codius Desktop release branch [skip release-gate]"
            git push origin HEAD:feat/codius-productization
          fi

      - name: Mark pull request ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr ready 1 --repo prismosoft/codius-desktop || true
          gh pr comment 1 --repo prismosoft/codius-desktop --body "Codius Desktop release gate passed: formatting, typecheck, protocol/server/desktop/app tests, server and Electron builds, and product-contract audit are green. Temporary productization automation was removed."
