name: One-time Codius formatting

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-time-codius-format.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --include=dev
      - run: npm run format

      - name: Post formatter patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-ext-diff --unified=20 > /tmp/codius-format.patch
          {
            echo '<!-- codius-format-patch -->'
            echo '## Codius formatter patch'
            echo
            echo '```diff'
            cat /tmp/codius-format.patch
            echo '```'
          } > /tmp/codius-format-comment.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/1/comments" --paginate --jq '.[] | select(.body | contains("<!-- codius-format-patch -->")) | .id' | tail -n 1)
          if [[ -n "$existing" ]]; then
            jq -n --rawfile body /tmp/codius-format-comment.md '{body: $body}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input -
          else
            gh pr comment 1 --body-file /tmp/codius-format-comment.md
          fi
