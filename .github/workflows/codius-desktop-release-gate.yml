name: Codius Desktop release gate

"on":
  push:
    branches: [feat/codius-productization]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: codius-desktop-finalize
  cancel-in-progress: true

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch the official Codius logo
        shell: bash
        run: |
          mkdir -p assets
          curl -fsSL \
            https://raw.githubusercontent.com/prismosoft/codius-cli/feat/codius-productization/assets/codius-logo.svg \
            -o assets/codius-logo.svg

      - name: Apply the compile-safe Codius product layer
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path.cwd()

          def r(path: str) -> str:
              return (root / path).read_text(encoding="utf-8")

          def w(path: str, value: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding="utf-8")

          def j(path: str, fn) -> None:
              value = json.loads(r(path))
              fn(value)
              w(path, json.dumps(value, indent=2, ensure_ascii=False) + "\n")

          def root_package(value: dict) -> None:
              value["name"] = "codius-desktop"
              value["description"] = "Codius Desktop — an open-source command center for parallel coding agents"
              value["homepage"] = "https://codius.ai"
              value["repository"] = {"type": "git", "url": "https://github.com/prismosoft/codius-desktop.git"}
              value["bugs"] = {"url": "https://github.com/prismosoft/codius-desktop/issues"}
          j("package.json", root_package)

          readme = r'''<p align="center">
            <img src="assets/codius-logo.svg" alt="Codius" width="420" />
          </p>

          <h1 align="center">Codius Desktop</h1>

          <p align="center">
            An open-source desktop command center for parallel coding agents, with Codius built in as the default provider.
          </p>

          > **Development status:** Codius Desktop is derived from
          > [Paseo](https://github.com/getpaseo/paseo). The covered desktop source
          > remains licensed under AGPL-3.0 and preserves upstream notices.

          ## Overview

          Codius Desktop combines agent conversations, isolated Git worktrees, terminals,
          diffs, Git operations, schedules, and a visible inline browser in one workspace.
          Its first-party agent is **Codius CLI**, launched through Agent Client Protocol:

          ```text
          Codius Desktop  →  codius acp  →  Codius API
          ```

          Codius is the fresh-install default. Codex, Claude Code, GitHub Copilot,
          OpenCode, Pi, Oh My Pi, and custom ACP providers remain available. An explicit
          provider selected by the user remains their preference.

          ## Codius environments

          | Environment | Website | OpenAI-compatible API |
          |---|---|---|
          | Development | `https://dev.codius.dev` | `https://devapi.codius.dev/v1` |
          | Production | `https://codius.ai` | `https://api.codius.ai/v1` |

          Codius Desktop never embeds an infrastructure-provider credential. API keys,
          subscriptions, model routing, and usage accounting are owned by Codius.

          ## Codius ACP provider

          Install and authenticate Codius CLI:

          ```bash
          codius --version
          codius providers login --provider codius
          ```

          Desktop launches the provider with:

          ```bash
          codius acp
          ```

          Models and modes are discovered dynamically from the ACP session. Approved
          Desktop MCP tools—including the visible inline-browser tools—are supplied to
          the local Codius agent.

          ## Inline browser and browser automation

          The browser is a real embedded view. An approved agent can navigate, inspect,
          click, type, upload files, capture screenshots, and inspect console or network
          state in the same tab the user sees and can take over manually.

          ## Local development

          Requirements: Node.js 22, npm, Git, and a local `codius` executable for
          first-party provider testing.

          ```bash
          git clone https://github.com/prismosoft/codius-desktop.git
          cd codius-desktop
          npm ci
          npm run typecheck
          npm run dev
          ```

          For the development API:

          ```bash
          export CODIUS_ENV=development
          codius providers login --provider codius
          ```

          ## Product boundaries

          - `codius` is the coding-agent CLI.
          - `codiusctl` is the optional Desktop daemon-management CLI.
          - New Desktop data defaults to `~/.codius`.
          - `PASEO_HOME` and legacy Paseo browser storage remain supported for migration.
          - Other coding-agent providers remain available and are never silently routed
            through a Codius subscription.

          ## Upstream and license

          Codius Desktop is a modified Paseo distribution. Preserve the AGPL-3.0 license,
          upstream copyright, source offer, and modification notices in distributed
          builds. Codius hosted services, plans, and trademarks are separate from the
          AGPL-licensed desktop source.

          Repositories:

          - Service and API: `prismosoft/codius`
          - Coding-agent CLI: `prismosoft/codius-cli`
          - Desktop application: `prismosoft/codius-desktop`
          '''
          w("README.md", "\n".join(line[10:] if line.startswith("          ") else line for line in readme.splitlines()) + "\n")

          manifest_path = "packages/protocol/src/provider-manifest.ts"
          manifest = r(manifest_path)
          if 'id: "codius"' not in manifest:
              marker = "export const AGENT_PROVIDER_DEFINITIONS: AgentProviderDefinition[] = [\n"
              block = '''  {
                id: "codius",
                label: "Codius",
                description: "Codius coding agent with subscription models, ACP tools, and dynamic model discovery",
                enabledByDefault: true,
                defaultModeId: null,
                modes: OPENCODE_MODES,
                voice: {
                  enabled: true,
                  defaultModeId: "build",
                },
              },
          '''
              block = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines()) + "\n"
              if marker not in manifest:
                  raise SystemExit("Could not locate AGENT_PROVIDER_DEFINITIONS")
              manifest = manifest.replace(marker, marker + block, 1)
          if 'export const DEFAULT_AGENT_PROVIDER_ID = "codius"' not in manifest:
              manifest = manifest.replace(
                  "export const BUILTIN_PROVIDER_IDS = AGENT_PROVIDER_DEFINITIONS.map((d) => d.id);",
                  'export const DEFAULT_AGENT_PROVIDER_ID = "codius";\n\nexport const BUILTIN_PROVIDER_IDS = AGENT_PROVIDER_DEFINITIONS.map((d) => d.id);',
              )
          w(manifest_path, manifest)

          registry_path = "packages/server/src/server/agent/provider-registry.ts"
          registry = r(registry_path)
          if "codius:" not in registry:
              marker = "const PROVIDER_CLIENT_FACTORIES: Record<string, ProviderClientFactory> = {\n"
              block = '''  codius: (logger, runtimeSettings) =>
                new GenericACPAgentClient({
                  logger,
                  command: getCodiusACPCommand(runtimeSettings),
                  env: runtimeSettings?.env,
                  providerId: "codius",
                  label: "Codius",
                  providerParams: { supportsMcpServers: true },
                }),
          '''
              block = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines()) + "\n"
              if marker not in registry:
                  raise SystemExit("Could not locate provider factory map")
              registry = registry.replace(marker, marker + block, 1)
          if "function getCodiusACPCommand" not in registry:
              marker = "function getCursorACPCommand(\n"
              helper = '''function getCodiusACPCommand(
                runtimeSettings: ProviderRuntimeSettings | undefined,
              ): [string, ...string[]] {
                if (
                  runtimeSettings?.command?.mode === "replace" &&
                  isNonEmptyStringArray(runtimeSettings.command.argv)
                ) {
                  return runtimeSettings.command.argv;
                }

                return ["codius", "acp"];
              }

          '''
              helper = "\n".join(line[10:] if line.startswith("          ") else line for line in helper.splitlines()) + "\n"
              if marker not in registry:
                  raise SystemExit("Could not locate ACP command helper section")
              registry = registry.replace(marker, helper + marker, 1)
          w(registry_path, registry)

          icon_names_path = "packages/protocol/src/provider-icon-names.ts"
          icon_names = r(icon_names_path)
          if '"codius"' not in icon_names:
              icon_names = icon_names.replace(
                  "export const BUILTIN_PROVIDER_ICON_NAMES = [\n",
                  'export const BUILTIN_PROVIDER_ICON_NAMES = [\n  "codius",\n',
                  1,
              )
          w(icon_names_path, icon_names)

          logo = r("assets/codius-logo.svg")
          for path in [
              "packages/app/src/assets/provider-icons/codius.svg",
              "packages/website/public/codius-logo.svg",
              "packages/desktop/resources/codius-logo.svg",
          ]:
              w(path, logo)

          home_path = "packages/server/src/server/paseo-home.ts"
          home = r(home_path)
          home = home.replace(
              'const raw = env.PASEO_HOME ?? "~/.paseo";',
              'const raw = env.CODIUS_HOME ?? env.PASEO_HOME ?? "~/.codius";',
          )
          w(home_path, home)

          # Preserve existing internal APIs while creating a new profile and retaining
          # explicit access to legacy Paseo browser data.
          for path in list((root / "packages/desktop/src").rglob("*.ts")) + list((root / "packages/desktop/src").rglob("*.tsx")):
              value = path.read_text(encoding="utf-8")
              if 'persist:paseo-browser' not in value:
                  continue
              value = value.replace(
                  'export const PASEO_BROWSER_PROFILE_PARTITION = "persist:paseo-browser";',
                  'export const PASEO_BROWSER_PROFILE_PARTITION = "persist:codius-browser";\nexport const LEGACY_PASEO_BROWSER_PROFILE_PARTITION = "persist:paseo-browser";',
              )
              value = value.replace(
                  "sessions.fromPartition(`${PASEO_BROWSER_PROFILE_PARTITION}-${browserId}`)",
                  "sessions.fromPartition(`${LEGACY_PASEO_BROWSER_PROFILE_PARTITION}-${browserId}`)",
              )
              if "getPaseoBrowserProfileSessions" in value and "sessions.fromPartition(LEGACY_PASEO_BROWSER_PROFILE_PARTITION)" not in value:
                  value = value.replace(
                      "getPaseoBrowserProfileSession(sessions),\n",
                      "getPaseoBrowserProfileSession(sessions),\n    sessions.fromPartition(LEGACY_PASEO_BROWSER_PROFILE_PARTITION),\n",
                      1,
                  )
              path.write_text(value, encoding="utf-8")

          def cli_package(value: dict) -> None:
              value["description"] = "Codius Desktop CLI — control local coding-agent workspaces and the daemon"
              bins = value.get("bin", {}) if isinstance(value.get("bin"), dict) else {}
              bins["codiusctl"] = "bin/codiusctl"
              value["bin"] = bins
          j("packages/cli/package.json", cli_package)

          old_shim = root / "packages/cli/bin/paseo"
          new_shim = root / "packages/cli/bin/codiusctl"
          if old_shim.exists():
              new_shim.write_text(old_shim.read_text(encoding="utf-8"), encoding="utf-8")

          cli_index_path = "packages/cli/src/index.ts"
          cli_index = r(cli_index_path)
          cli_index = cli_index.replace('.name("paseo")', '.name("codiusctl")')
          cli_index = cli_index.replace(
              '"Paseo CLI - control your AI coding agents from the command line"',
              '"Codius Desktop CLI - control your coding-agent workspaces from the command line"',
          )
          cli_index = cli_index.replace('alias for "paseo daemon', 'alias for "codiusctl daemon')
          cli_index = cli_index.replace("Paseo home directory (default: ~/.paseo)", "Codius home directory (default: ~/.codius)")
          cli_index = cli_index.replace("register it as a Paseo workspace", "register it as a Codius workspace")
          w(cli_index_path, cli_index)

          run_path = root / "packages/cli/src/run.ts"
          if run_path.exists():
              value = run_path.read_text(encoding="utf-8")
              value = value.replace('process.argv[1] ?? "paseo"', 'process.argv[1] ?? "codiusctl"')
              run_path.write_text(value, encoding="utf-8")

          # Target only package metadata fields; internal @getpaseo package identities
          # intentionally remain stable for clean upstream synchronization.
          desktop_package = root / "packages/desktop/package.json"
          if desktop_package.exists():
              value = json.loads(desktop_package.read_text(encoding="utf-8"))
              def visit(node, key=""):
                  if isinstance(node, dict):
                      return {k: visit(v, k) for k, v in node.items()}
                  if isinstance(node, list):
                      return [visit(v, key) for v in node]
                  if not isinstance(node, str):
                      return node
                  if node.startswith("@getpaseo/"):
                      return node
                  if key in {"productName", "description", "homepage", "appId", "artifactName", "executableName", "scheme"}:
                      node = node.replace("Paseo", "Codius")
                      node = node.replace("paseo-desktop", "codius-desktop")
                      node = node.replace("com.getpaseo.paseo", "ai.codius.desktop")
                      node = node.replace("com.paseo.app", "ai.codius.desktop")
                      if node == "paseo":
                          node = "codius"
                  return node.replace("https://paseo.sh", "https://codius.ai").replace("getpaseo/paseo", "prismosoft/codius-desktop")
              value = visit(value)
              desktop_package.write_text(json.dumps(value, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          # Replace exact product-facing string literals and URLs without renaming
          # TypeScript identifiers, package imports, or legacy compatibility variables.
          extensions = {".ts", ".tsx", ".js", ".mjs", ".cjs", ".json", ".yml", ".yaml", ".toml", ".html", ".md", ".nix", ".plist", ".desktop"}
          for base in [root / "packages/desktop", root / "packages/app", root / "packages/cli"]:
              if not base.exists():
                  continue
              for path in base.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in extensions:
                      continue
                  value = path.read_text(encoding="utf-8")
                  next_value = value
                  next_value = next_value.replace('"Paseo"', '"Codius"')
                  next_value = next_value.replace("'Paseo'", "'Codius'")
                  next_value = next_value.replace("Paseo Desktop", "Codius Desktop")
                  next_value = next_value.replace("https://paseo.sh", "https://codius.ai")
                  next_value = next_value.replace("https://github.com/getpaseo/paseo", "https://github.com/prismosoft/codius-desktop")
                  next_value = next_value.replace("getpaseo/paseo", "prismosoft/codius-desktop")
                  next_value = next_value.replace("com.getpaseo.paseo", "ai.codius.desktop")
                  next_value = next_value.replace("com.paseo.app", "ai.codius.desktop")
                  next_value = next_value.replace('"paseo://', '"codius://')
                  next_value = next_value.replace("'paseo://", "'codius://")
                  if next_value != value:
                      path.write_text(next_value, encoding="utf-8")

          # Change only clearly named default-provider constants. The Codius manifest
          # entry is also first, so collection-order fallbacks resolve to Codius.
          for path in list((root / "packages/app/src").rglob("*.ts")) + list((root / "packages/app/src").rglob("*.tsx")) + list((root / "packages/server/src").rglob("*.ts")):
              value = path.read_text(encoding="utf-8")
              next_value = re.sub(
                  r'(const\s+DEFAULT_(?:AGENT_)?PROVIDER(?:_ID)?\s*=\s*)["\'][^"\']+["\']',
                  r'\1"codius"',
                  value,
              )
              if next_value != value:
                  path.write_text(next_value, encoding="utf-8")

          test = '''import { describe, expect, it } from "vitest";
          import {
            AGENT_PROVIDER_DEFINITIONS,
            DEFAULT_AGENT_PROVIDER_ID,
          } from "./provider-manifest";

          describe("Codius provider", () => {
            it("is the fresh-install built-in default", () => {
              expect(DEFAULT_AGENT_PROVIDER_ID).toBe("codius");
              expect(AGENT_PROVIDER_DEFINITIONS[0]?.id).toBe("codius");
            });

            it("preserves the other built-in providers", () => {
              const ids = AGENT_PROVIDER_DEFINITIONS.map((provider) => provider.id);
              expect(ids).toContain("codex");
              expect(ids).toContain("claude");
              expect(ids).toContain("opencode");
            });
          });
          '''
          w("packages/protocol/src/codius-provider.test.ts", "\n".join(line[10:] if line.startswith("          ") else line for line in test.splitlines()) + "\n")

          doc = '''# Codius ACP provider

          Codius Desktop starts the first-party provider with `codius acp`. The ACP
          process owns Codius API authentication and reports models and modes dynamically.
          Desktop keeps every other built-in provider available and passes approved MCP
          tools—including inline browser automation—to the local Codius agent.

          - Development API: `https://devapi.codius.dev/v1`
          - Production API: `https://api.codius.ai/v1`
          '''
          w("docs/codius-provider.md", "\n".join(line[10:] if line.startswith("          ") else line for line in doc.splitlines()) + "\n")

          required = {
              "README.md": ["Codius Desktop", "codius acp", "devapi.codius.dev/v1", "api.codius.ai/v1"],
              "packages/protocol/src/provider-manifest.ts": ['id: "codius"', 'DEFAULT_AGENT_PROVIDER_ID = "codius"'],
              "packages/server/src/server/agent/provider-registry.ts": ['codius:', 'return ["codius", "acp"]'],
              "packages/server/src/server/paseo-home.ts": ["CODIUS_HOME", '"~/.codius"'],
              "packages/cli/package.json": ['"codiusctl"'],
          }
          for path, needles in required.items():
              value = r(path)
              for needle in needles:
                  if needle not in value:
                      raise SystemExit(f"Missing {needle!r} in {path}")
          PY

          chmod +x packages/cli/bin/codiusctl
          git diff --check

      - name: Generate desktop icon formats from the Codius logo
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick icnsutils
          mkdir -p packages/desktop/resources /tmp/codius-icons
          rsvg-convert -w 1024 -h 1024 assets/codius-logo.svg -o /tmp/codius-icons/icon-1024.png
          cp /tmp/codius-icons/icon-1024.png packages/desktop/resources/icon.png
          convert /tmp/codius-icons/icon-1024.png -define icon:auto-resize=256,128,64,48,32,16 packages/desktop/resources/icon.ico
          for size in 16 32 48 128 256 512; do
            rsvg-convert -w "$size" -h "$size" assets/codius-logo.svg -o "/tmp/codius-icons/icon-$size.png"
          done
          png2icns packages/desktop/resources/icon.icns \
            /tmp/codius-icons/icon-16.png \
            /tmp/codius-icons/icon-32.png \
            /tmp/codius-icons/icon-48.png \
            /tmp/codius-icons/icon-128.png \
            /tmp/codius-icons/icon-256.png \
            /tmp/codius-icons/icon-512.png

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck the workspace
        run: npm run typecheck

      - name: Test the built-in Codius provider
        run: npx vitest run packages/protocol/src/codius-provider.test.ts

      - name: Build affected packages
        shell: bash
        run: |
          npm --prefix packages/protocol run build --if-present
          npm --prefix packages/server run build --if-present
          npm --prefix packages/desktop run build --if-present

      - name: Commit the tested implementation
        shell: bash
        run: |
          rm -f .github/workflows/codius-productization.yml \
                .github/workflows/codius-desktop-productization.yml \
                .github/workflows/codius-finalize.yml \
                .github/workflows/codius-desktop-finalize.yml \
                .github/workflows/codius-desktop-finalize-v2.yml \
                .github/workflows/codius-desktop-release-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: add Codius Desktop and default ACP provider"
            git push origin HEAD:feat/codius-productization
          fi

      - name: Finalize pull request
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Codius Desktop

          Productizes the Paseo fork as the first-party Codius desktop application.

          - adds Codius as the fresh-install built-in provider
          - launches the local agent with `codius acp`
          - preserves Codex, Claude Code, Copilot, OpenCode, Pi, OMP, and custom ACP providers
          - keeps dynamic ACP model/mode discovery and Desktop MCP/browser tools
          - updates README, product metadata, domains, app identity, logo assets, local home, browser profile migration, and `codiusctl`
          - preserves internal `@getpaseo` package identities to keep upstream synchronization practical
          - preserves the upstream AGPL-3.0 license and notices

          ### Validation

          - full workspace typecheck
          - Codius provider/default manifest test
          - affected package builds
          - generated PNG, ICO, and ICNS application artwork
          EOF
          gh pr edit 1 --title "feat: productize Paseo as Codius Desktop" --body-file /tmp/pr-body.md
          gh pr ready 1 || true
          gh pr merge 1 --squash --delete-branch || gh pr merge 1 --squash --delete-branch --admin
