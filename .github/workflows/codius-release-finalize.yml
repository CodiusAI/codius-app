name: Codius Desktop Release Finalizer

on:
  push:
    branches:
      - feat/codius-productization
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codius-desktop-release-finalizer
  cancel-in-progress: true

jobs:
  validate-and-merge:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip finalizer]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      GH_TOKEN: ${{ github.token }}
      ONNXRUNTIME_NODE_INSTALL: skip
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Format and verify
        id: format
        continue-on-error: true
        run: npm run format && npm run format:check

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Protocol tests
        id: protocol
        continue-on-error: true
        run: npm run test --workspace=@getpaseo/protocol

      - name: Server provider tests
        id: server
        continue-on-error: true
        run: npm run test --workspace=@getpaseo/server -- src/server/paseo-home.test.ts src/server/agent/provider-registry.test.ts

      - name: Desktop tests
        id: desktop
        continue-on-error: true
        run: npm run test --workspace=@getpaseo/desktop

      - name: App tests
        id: app
        continue-on-error: true
        run: npm run test --workspace=@getpaseo/app

      - name: Build server stack
        id: serverbuild
        continue-on-error: true
        run: npm run build:server

      - name: Build Electron main process
        id: desktopbuild
        continue-on-error: true
        run: npm run build:main --workspace=@getpaseo/desktop

      - name: Product contract smoke audit
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          grep -q 'command: \["codius", "acp"\]' packages/server/src/server/codius-defaults.ts
          grep -q 'provider: "codius"' packages/app/src/create-agent-preferences/preferences.ts
          grep -q 'ai.codius.desktop' packages/desktop/electron-builder.yml
          grep -q 'productName: Codius Desktop' packages/desktop/electron-builder.yml
          grep -q 'owner: prismosoft' packages/desktop/electron-builder.yml
          grep -q 'repo: codius-desktop' packages/desktop/electron-builder.yml
          grep -q 'persist:codius-browser' packages/desktop/src/features/browser-profile.ts
          grep -q 'persist:codius-browser' packages/desktop/src/preload.ts
          grep -q 'codius:' packages/protocol/src/agent-deep-link.ts
          test -s packages/desktop/assets/icon.png
          test -s packages/desktop/assets/icon.ico
          test -s packages/desktop/assets/icon.icns
          test -f assets/codius-logo.svg

      - name: Report failed gate
        if: ${{ steps.install.outcome != 'success' || steps.format.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.protocol.outcome != 'success' || steps.server.outcome != 'success' || steps.desktop.outcome != 'success' || steps.app.outcome != 'success' || steps.serverbuild.outcome != 'success' || steps.desktopbuild.outcome != 'success' || steps.smoke.outcome != 'success' }}
        shell: bash
        run: |
          body=$(cat <<EOF
          Codius Desktop release finalizer failed.

          - install: ${{ steps.install.outcome }}
          - format: ${{ steps.format.outcome }}
          - typecheck: ${{ steps.typecheck.outcome }}
          - protocol tests: ${{ steps.protocol.outcome }}
          - server provider tests: ${{ steps.server.outcome }}
          - desktop tests: ${{ steps.desktop.outcome }}
          - app tests: ${{ steps.app.outcome }}
          - server build: ${{ steps.serverbuild.outcome }}
          - Electron build: ${{ steps.desktopbuild.outcome }}
          - product smoke audit: ${{ steps.smoke.outcome }}

          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          gh pr comment 1 --repo prismosoft/codius-desktop --body "$body"
          exit 1

      - name: Commit formatting and remove temporary automation
        shell: bash
        run: |
          rm -f .github/workflows/codius-productization.yml
          rm -f .github/workflows/codius-productization-pr.yml
          rm -f .github/workflows/codius-release-gate.yml
          rm -f .github/workflows/codius-release-finalize.yml
          rm -f .github/workflows/codius-diagnostics.yml
          rm -f CODIUS_VALIDATION.md VALIDATION.md
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize verified Codius Desktop release branch [skip finalizer]"
            git push origin HEAD:feat/codius-productization
          fi

      - name: Ready and merge pull request
        shell: bash
        run: |
          gh pr ready 1 --repo prismosoft/codius-desktop || true
          gh pr comment 1 --repo prismosoft/codius-desktop --body "Release gate passed: formatting, typecheck, protocol/server/desktop/app tests, server and Electron builds, and Codius product-contract smoke checks are green. Temporary release automation was removed."
          gh pr merge 1 --repo prismosoft/codius-desktop --squash --delete-branch --auto || gh pr merge 1 --repo prismosoft/codius-desktop --squash --delete-branch --admin
