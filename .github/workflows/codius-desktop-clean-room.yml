name: Codius Desktop clean-room release

"on":
  push:
    branches: [feat/codius-productization]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: codius-desktop-finalize
  cancel-in-progress: true

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebuild the feature branch from upstream Paseo base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p assets
          curl -fsSL https://raw.githubusercontent.com/prismosoft/codius-cli/feat/codius-productization/assets/codius-logo.svg -o assets/codius-logo.svg \
            || curl -fsSL https://raw.githubusercontent.com/prismosoft/codius-cli/dev/assets/codius-logo.svg -o assets/codius-logo.svg

      - name: Apply the Codius Desktop product layer
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path.cwd()

          def read(path: str) -> str:
              return (root / path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding="utf-8")

          def update_json(path: str, fn) -> None:
              data = json.loads(read(path))
              fn(data)
              write(path, json.dumps(data, indent=2, ensure_ascii=False) + "\n")

          def root_package(data: dict) -> None:
              data["name"] = "codius-desktop"
              data["description"] = "Codius Desktop — an open-source command center for parallel coding agents"
              data["homepage"] = "https://codius.ai"
              data["repository"] = {"type": "git", "url": "https://github.com/prismosoft/codius-desktop.git"}
              data["bugs"] = {"url": "https://github.com/prismosoft/codius-desktop/issues"}
          update_json("package.json", root_package)

          readme = '''<p align="center">
            <img src="assets/codius-logo.svg" alt="Codius" width="420" />
          </p>

          <h1 align="center">Codius Desktop</h1>

          <p align="center">
            An open-source desktop command center for parallel coding agents, with Codius built in as the default provider.
          </p>

          > Codius Desktop is derived from [Paseo](https://github.com/getpaseo/paseo).
          > Covered source remains licensed under AGPL-3.0 and preserves upstream notices.

          ## Overview

          Codius Desktop combines agent conversations, isolated Git worktrees, terminals,
          diffs, Git operations, schedules, and a visible inline browser in one workspace.
          The first-party agent is Codius CLI, launched through Agent Client Protocol:

          ```text
          Codius Desktop  →  codius acp  →  Codius API
          ```

          Codius is the fresh-install default. Codex, Claude Code, GitHub Copilot,
          OpenCode, Pi, Oh My Pi, and custom ACP providers remain available. An explicit
          provider selected by a user remains their preference.

          ## Environments

          | Environment | Website | OpenAI-compatible API |
          |---|---|---|
          | Development | `https://dev.codius.dev` | `https://devapi.codius.dev/v1` |
          | Production | `https://codius.ai` | `https://api.codius.ai/v1` |

          Desktop never embeds an infrastructure-provider credential. Codius owns API
          keys, subscriptions, model routing, and usage accounting.

          ## Codius provider

          ```bash
          codius --version
          codius providers login --provider codius
          codius acp
          ```

          Models and modes are discovered dynamically from ACP. Approved Desktop MCP
          tools—including the visible inline-browser tools—are supplied to the local
          Codius agent.

          ## Inline browser and automation

          The browser is a real embedded view. An approved agent can navigate, inspect,
          click, type, upload files, capture screenshots, and inspect console or network
          state in the same tab the user sees and can take over manually.

          ## Development

          Requirements: Node.js 22, npm, Git, and a local `codius` executable.

          ```bash
          git clone https://github.com/prismosoft/codius-desktop.git
          cd codius-desktop
          npm ci
          npm run typecheck
          npm run dev
          ```

          To use the development API:

          ```bash
          export CODIUS_ENV=development
          codius providers login --provider codius
          ```

          ## Product boundaries

          - `codius` is the coding-agent CLI.
          - `codiusctl` is the optional Desktop daemon-management CLI.
          - New local data defaults to `~/.codius`.
          - `PASEO_HOME` and legacy Paseo browser storage remain migration-compatible.
          - Other providers remain available and are never silently routed through a
            Codius subscription.

          ## License and upstream

          Preserve the Paseo AGPL-3.0 license, upstream copyright, source offer, and
          modification notices in distributed builds. Codius hosted services, plans,
          and trademarks are separate from the AGPL-covered desktop source.

          Repositories:

          - Service/API: `prismosoft/codius`
          - CLI: `prismosoft/codius-cli`
          - Desktop: `prismosoft/codius-desktop`
          '''
          write("README.md", "\n".join(line[10:] if line.startswith("          ") else line for line in readme.splitlines()) + "\n")

          manifest_path = "packages/protocol/src/provider-manifest.ts"
          manifest = read(manifest_path)
          marker = "export const AGENT_PROVIDER_DEFINITIONS: AgentProviderDefinition[] = [\n"
          block = '''  {
            id: "codius",
            label: "Codius",
            description: "Codius coding agent with subscription models, ACP tools, and dynamic model discovery",
            enabledByDefault: true,
            defaultModeId: null,
            modes: OPENCODE_MODES,
            voice: {
              enabled: true,
              defaultModeId: "build",
            },
          },
          '''
          block = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines()) + "\n"
          if marker not in manifest:
              raise SystemExit("provider manifest marker missing")
          manifest = manifest.replace(marker, marker + block, 1)
          manifest = manifest.replace(
              "export const BUILTIN_PROVIDER_IDS = AGENT_PROVIDER_DEFINITIONS.map((d) => d.id);",
              'export const DEFAULT_AGENT_PROVIDER_ID = "codius";\n\nexport const BUILTIN_PROVIDER_IDS = AGENT_PROVIDER_DEFINITIONS.map((d) => d.id);',
          )
          write(manifest_path, manifest)

          registry_path = "packages/server/src/server/agent/provider-registry.ts"
          registry = read(registry_path)
          factory_marker = "const PROVIDER_CLIENT_FACTORIES: Record<string, ProviderClientFactory> = {\n"
          factory = '''  codius: (logger, runtimeSettings) =>
            new GenericACPAgentClient({
              logger,
              command: getCodiusACPCommand(runtimeSettings),
              env: runtimeSettings?.env,
              providerId: "codius",
              label: "Codius",
              providerParams: { supportsMcpServers: true },
            }),
          '''
          factory = "\n".join(line[10:] if line.startswith("          ") else line for line in factory.splitlines()) + "\n"
          if factory_marker not in registry:
              raise SystemExit("provider registry marker missing")
          registry = registry.replace(factory_marker, factory_marker + factory, 1)
          helper_marker = "function getCursorACPCommand(\n"
          helper = '''function getCodiusACPCommand(
            runtimeSettings: ProviderRuntimeSettings | undefined,
          ): [string, ...string[]] {
            if (
              runtimeSettings?.command?.mode === "replace" &&
              isNonEmptyStringArray(runtimeSettings.command.argv)
            ) {
              return runtimeSettings.command.argv;
            }

            return ["codius", "acp"];
          }

          '''
          helper = "\n".join(line[10:] if line.startswith("          ") else line for line in helper.splitlines()) + "\n"
          if helper_marker not in registry:
              raise SystemExit("ACP command helper marker missing")
          registry = registry.replace(helper_marker, helper + helper_marker, 1)
          write(registry_path, registry)

          icon_names_path = "packages/protocol/src/provider-icon-names.ts"
          icon_names = read(icon_names_path).replace(
              "export const BUILTIN_PROVIDER_ICON_NAMES = [\n",
              'export const BUILTIN_PROVIDER_ICON_NAMES = [\n  "codius",\n',
              1,
          )
          write(icon_names_path, icon_names)

          logo = read("assets/codius-logo.svg")
          for path in [
              "packages/app/src/assets/provider-icons/codius.svg",
              "packages/website/public/codius-logo.svg",
              "packages/desktop/resources/codius-logo.svg",
          ]:
              write(path, logo)

          home_path = "packages/server/src/server/paseo-home.ts"
          home = read(home_path).replace(
              'const raw = env.PASEO_HOME ?? "~/.paseo";',
              'const raw = env.CODIUS_HOME ?? env.PASEO_HOME ?? "~/.codius";',
          )
          write(home_path, home)

          # Use a new browser profile while explicitly retaining every legacy Paseo
          # profile in the clear/migration list. Internal function names stay stable.
          for path in list((root / "packages/desktop/src").rglob("*.ts")) + list((root / "packages/desktop/src").rglob("*.tsx")):
              value = path.read_text(encoding="utf-8")
              if 'export const PASEO_BROWSER_PROFILE_PARTITION = "persist:paseo-browser";' not in value:
                  continue
              value = value.replace(
                  'export const PASEO_BROWSER_PROFILE_PARTITION = "persist:paseo-browser";',
                  'export const PASEO_BROWSER_PROFILE_PARTITION = "persist:codius-browser";\nexport const LEGACY_PASEO_BROWSER_PROFILE_PARTITION = "persist:paseo-browser";',
              )
              value = value.replace(
                  "sessions.fromPartition(`${PASEO_BROWSER_PROFILE_PARTITION}-${browserId}`)",
                  "sessions.fromPartition(`${LEGACY_PASEO_BROWSER_PROFILE_PARTITION}-${browserId}`)",
              )
              value = value.replace(
                  "getPaseoBrowserProfileSession(sessions),\n",
                  "getPaseoBrowserProfileSession(sessions),\n    sessions.fromPartition(LEGACY_PASEO_BROWSER_PROFILE_PARTITION),\n",
                  1,
              )
              path.write_text(value, encoding="utf-8")

          def cli_package(data: dict) -> None:
              data["description"] = "Codius Desktop CLI — control local coding-agent workspaces and the daemon"
              bins = data.get("bin", {}) if isinstance(data.get("bin"), dict) else {}
              bins["codiusctl"] = "bin/codiusctl"
              data["bin"] = bins
          update_json("packages/cli/package.json", cli_package)
          old_shim = root / "packages/cli/bin/paseo"
          new_shim = root / "packages/cli/bin/codiusctl"
          new_shim.write_text(old_shim.read_text(encoding="utf-8"), encoding="utf-8")

          cli_index_path = "packages/cli/src/index.ts"
          cli_index = read(cli_index_path)
          cli_index = cli_index.replace('.name("paseo")', '.name("codiusctl")')
          cli_index = cli_index.replace(
              '"Paseo CLI - control your AI coding agents from the command line"',
              '"Codius Desktop CLI - control your coding-agent workspaces from the command line"',
          )
          cli_index = cli_index.replace('alias for "paseo daemon', 'alias for "codiusctl daemon')
          cli_index = cli_index.replace("Paseo home directory (default: ~/.paseo)", "Codius home directory (default: ~/.codius)")
          cli_index = cli_index.replace("register it as a Paseo workspace", "register it as a Codius workspace")
          write(cli_index_path, cli_index)
          run_path = root / "packages/cli/src/run.ts"
          if run_path.exists():
              run_path.write_text(run_path.read_text(encoding="utf-8").replace('process.argv[1] ?? "paseo"', 'process.argv[1] ?? "codiusctl"'), encoding="utf-8")

          # Package metadata and exact user-visible string literals only. Keep
          # @getpaseo workspace package names and TypeScript identifiers unchanged.
          desktop_package = root / "packages/desktop/package.json"
          if desktop_package.exists():
              data = json.loads(desktop_package.read_text(encoding="utf-8"))
              def visit(node, key=""):
                  if isinstance(node, dict):
                      return {k: visit(v, k) for k, v in node.items()}
                  if isinstance(node, list):
                      return [visit(v, key) for v in node]
                  if not isinstance(node, str) or node.startswith("@getpaseo/"):
                      return node
                  if key in {"productName", "description", "homepage", "appId", "artifactName", "executableName", "scheme"}:
                      node = node.replace("Paseo", "Codius")
                      node = node.replace("paseo-desktop", "codius-desktop")
                      node = node.replace("com.getpaseo.paseo", "ai.codius.desktop")
                      node = node.replace("com.paseo.app", "ai.codius.desktop")
                      if node == "paseo":
                          node = "codius"
                  return node.replace("https://paseo.sh", "https://codius.ai").replace("getpaseo/paseo", "prismosoft/codius-desktop")
              desktop_package.write_text(json.dumps(visit(data), indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          extensions = {".ts", ".tsx", ".js", ".mjs", ".cjs", ".json", ".yml", ".yaml", ".toml", ".html", ".md", ".nix", ".plist", ".desktop"}
          for base in [root / "packages/desktop", root / "packages/app", root / "packages/cli"]:
              for path in base.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in extensions:
                      continue
                  value = path.read_text(encoding="utf-8")
                  next_value = value
                  next_value = next_value.replace('"Paseo"', '"Codius"').replace("'Paseo'", "'Codius'")
                  next_value = next_value.replace("Paseo Desktop", "Codius Desktop")
                  next_value = next_value.replace("https://paseo.sh", "https://codius.ai")
                  next_value = next_value.replace("https://github.com/getpaseo/paseo", "https://github.com/prismosoft/codius-desktop")
                  next_value = next_value.replace("getpaseo/paseo", "prismosoft/codius-desktop")
                  next_value = next_value.replace("com.getpaseo.paseo", "ai.codius.desktop").replace("com.paseo.app", "ai.codius.desktop")
                  next_value = next_value.replace('"paseo://', '"codius://').replace("'paseo://", "'codius://")
                  if next_value != value:
                      path.write_text(next_value, encoding="utf-8")

          # Only constants explicitly named as provider defaults are changed.
          for path in list((root / "packages/app/src").rglob("*.ts")) + list((root / "packages/app/src").rglob("*.tsx")) + list((root / "packages/server/src").rglob("*.ts")):
              value = path.read_text(encoding="utf-8")
              next_value = re.sub(
                  r'(const\s+DEFAULT_(?:AGENT_)?PROVIDER(?:_ID)?\s*=\s*)["\'][^"\']+["\']',
                  r'\1"codius"',
                  value,
              )
              if next_value != value:
                  path.write_text(next_value, encoding="utf-8")

          test = '''import { describe, expect, it } from "vitest";
          import { AGENT_PROVIDER_DEFINITIONS, DEFAULT_AGENT_PROVIDER_ID } from "./provider-manifest";

          describe("Codius provider", () => {
            it("is the fresh-install default", () => {
              expect(DEFAULT_AGENT_PROVIDER_ID).toBe("codius");
              expect(AGENT_PROVIDER_DEFINITIONS[0]?.id).toBe("codius");
            });

            it("preserves the other built-in providers", () => {
              const ids = AGENT_PROVIDER_DEFINITIONS.map((provider) => provider.id);
              expect(ids).toContain("codex");
              expect(ids).toContain("claude");
              expect(ids).toContain("opencode");
            });
          });
          '''
          write("packages/protocol/src/codius-provider.test.ts", "\n".join(line[10:] if line.startswith("          ") else line for line in test.splitlines()) + "\n")
          write("docs/codius-provider.md", "# Codius ACP provider\n\nCodius Desktop starts its first-party agent with `codius acp`. Models and modes are discovered dynamically. Development API: `https://devapi.codius.dev/v1`. Production API: `https://api.codius.ai/v1`.\n")

          required = {
              "README.md": ["Codius Desktop", "codius acp", "devapi.codius.dev/v1", "api.codius.ai/v1"],
              "packages/protocol/src/provider-manifest.ts": ['id: "codius"', 'DEFAULT_AGENT_PROVIDER_ID = "codius"'],
              "packages/server/src/server/agent/provider-registry.ts": ['codius:', 'return ["codius", "acp"]'],
              "packages/server/src/server/paseo-home.ts": ["CODIUS_HOME", '"~/.codius"'],
              "packages/cli/package.json": ['"codiusctl"'],
          }
          for path, needles in required.items():
              value = read(path)
              for needle in needles:
                  if needle not in value:
                      raise SystemExit(f"Missing {needle!r} in {path}")
          PY
          chmod +x packages/cli/bin/codiusctl
          git diff --check

      - name: Generate application icon assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick icnsutils
          mkdir -p packages/desktop/resources /tmp/codius-icons
          rsvg-convert -w 1024 -h 1024 assets/codius-logo.svg -o /tmp/codius-icons/icon-1024.png
          cp /tmp/codius-icons/icon-1024.png packages/desktop/resources/icon.png
          convert /tmp/codius-icons/icon-1024.png -define icon:auto-resize=256,128,64,48,32,16 packages/desktop/resources/icon.ico
          for size in 16 32 48 128 256 512; do
            rsvg-convert -w "$size" -h "$size" assets/codius-logo.svg -o "/tmp/codius-icons/icon-$size.png"
          done
          png2icns packages/desktop/resources/icon.icns \
            /tmp/codius-icons/icon-16.png /tmp/codius-icons/icon-32.png \
            /tmp/codius-icons/icon-48.png /tmp/codius-icons/icon-128.png \
            /tmp/codius-icons/icon-256.png /tmp/codius-icons/icon-512.png

      - name: Install, typecheck, test, and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npx vitest run packages/protocol/src/codius-provider.test.ts
          npm --prefix packages/protocol run build --if-present
          npm --prefix packages/server run build --if-present
          npm --prefix packages/desktop run build --if-present

      - name: Publish the clean tested branch and merge PR 1
        shell: bash
        run: |
          rm -rf .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: productize Paseo as Codius Desktop"
          git push --force-with-lease origin HEAD:feat/codius-productization
          cat > /tmp/body.md <<'EOF'
          ## Codius Desktop

          Clean productization of the Paseo fork as Codius Desktop.

          - Codius is the fresh-install built-in provider
          - launches `codius acp` through the existing ACP architecture
          - retains Codex, Claude Code, Copilot, OpenCode, Pi, OMP, and custom providers
          - retains worktrees, Git, terminals, schedules, visible browser, browser automation, and MCP tools
          - Codius README, domains, branding, icon assets, local home, browser-profile migration, and `codiusctl`
          - internal `@getpaseo` package names retained for maintainable upstream synchronization
          - AGPL-3.0 license and upstream notices preserved

          Validation: workspace typecheck, provider/default tests, affected package builds, PNG/ICO/ICNS icon generation.
          EOF
          gh pr edit 1 --title "feat: productize Paseo as Codius Desktop" --body-file /tmp/body.md
          gh pr ready 1 || true
          gh pr merge 1 --squash --delete-branch || gh pr merge 1 --squash --delete-branch --admin
