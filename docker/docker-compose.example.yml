# Minimal Codius daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change CODIUS_PASSWORD first.
services:
  codius:
    image: ghcr.io/prismosoft/codius-desktop:latest
    container_name: codius
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      CODIUS_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # CODIUS_HOSTNAMES: "codius.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./codius-home:/home/codius
      # Code visible to Codius and the agents it launches.
      - ./workspace:/workspace
