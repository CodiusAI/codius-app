npmRebuild: false
appId: ai.codius.desktop
productName: Codius Desktop
executableName: codius-desktop
protocols:
  - name: Codius agent link
    schemes:
      - codius
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: ../../skills
    to: skills
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: prismosoft
  repo: codius-desktop
mac:
  artifactName: "Codius-Desktop-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/paseo
      to: bin/codiusctl
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Codius-Desktop-${version}-${arch}.${ext}"
  maintainer: "Prismosoft <prismosoft@gmail.com>"
  vendor: "Codius"
  extraResources:
    - from: bin/paseo
      to: bin/codiusctl
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
appImage:
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename would orphan the old binary and break shortcuts.
  artifactName: "Codius-Desktop-${arch}.${ext}"
win:
  artifactName: "Codius-Desktop-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/paseo.cmd
      to: bin/codiusctl.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
